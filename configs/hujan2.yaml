# Dataset configuration for Hujan-2 (Dataset Primer Aditya)
# Berdasarkan struktur folder dataset di Kaggle:
# /kaggle/input/hujan-2/mydata/
# ├── train/
# │   ├── images/
# │   │   ├── ir/
# │   │   └── vi/
# │   └── labels/
# │       └── vi/
# └── val/
#     ├── images/
#     │   ├── ir/
#     │   └── vi/
#     └── labels/
#         └── vi/

path: /kaggle/input/hujan-2/mydata

# Direktori split training (relatif terhadap 'path')
train_vis: train/images/vi
train_ir: train/images/ir
train_labels: train/labels/vi

# Direktori split validation (relatif terhadap 'path')
val_vis: val/images/vi
val_ir: val/images/ir
val_labels: val/labels/vi

# Kelas deteksi (sesuaikan jika ada nama/kelas lain)
nc: 1
names:
  0: person
