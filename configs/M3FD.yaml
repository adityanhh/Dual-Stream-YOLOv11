# Dataset configuration for M3FD (Multi-modal Multi-scenario Dataset)
# RGB (Visible) and IR (Thermal / Infrared) Object Detection

path: ./datasets/M3FD  # dataset root dir

# Training split directories (relative to 'path')
train_vis: images/vis_train
train_ir: images/Ir_train
train_labels: labels/vis_train

# Validation split directories (relative to 'path')
val_vis: images/vis_val
val_ir: images/Ir_val
val_labels: labels/vis_val

# Classes
nc: 6
names:
  0: People
  1: Car
  2: Bus
  3: Motorcycle
  4: Lamp
  5: Truck
